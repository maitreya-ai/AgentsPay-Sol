name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  program:
    name: Program (build + LiteSVM tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Cache Solana CLI + platform-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-4.4.1-platform-tools-v1.57-${{ runner.os }}
      - name: Install Solana CLI
        # GitHub release downloads occasionally fail; retry the installer.
        run: |
          BIN="$HOME/.local/share/solana/install/active_release/bin"
          if [ ! -x "$BIN/solana" ]; then
            for i in 1 2 3 4; do
              sh -c "$(curl -sSfL --retry 5 --retry-delay 10 https://release.anza.xyz/v4.4.1/install)" && break
              echo "install attempt $i failed, retrying in 30s"; sleep 30
            done
          fi
          "$BIN/solana" --version
          echo "$BIN" >> "$GITHUB_PATH"
      - name: Build SBF program
        # platform-tools downloads from GitHub releases occasionally 504; retry.
        run: |
          for i in 1 2 3; do
            cargo build-sbf --manifest-path programs/agentspay/Cargo.toml && exit 0
            echo "build-sbf attempt $i failed, retrying in 20s"; sleep 20
          done
          exit 1
      - name: Test
        run: cargo test -p agentspay

  typescript:
    name: SDK, apps & web (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run web:build
