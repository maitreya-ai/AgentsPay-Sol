name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  program:
    name: Program (build + LiteSVM tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.4.1/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Cache platform-tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/solana
          key: solana-platform-tools-v1.57-${{ runner.os }}
      - name: Build SBF program
        # platform-tools downloads from GitHub releases occasionally 504; retry.
        run: |
          for i in 1 2 3; do
            cargo build-sbf --manifest-path programs/agentspay/Cargo.toml && exit 0
            echo "build-sbf attempt $i failed, retrying in 20s"; sleep 20
          done
          exit 1
      - name: Test
        run: cargo test -p agentspay

  typescript:
    name: SDK, apps & web (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run web:build
