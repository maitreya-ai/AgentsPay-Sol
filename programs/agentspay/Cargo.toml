[package]
name = "agentspay"
version = "0.1.0"
description = "Attestation-gated, metered payments for AI agents on Solana"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "agentspay"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.2.2", default-features = false, features = ["solana-v4", "init-if-needed"] }
anchor-spl = { version = "=1.2.2", default-features = false, features = ["solana-v4", "token", "token_2022", "token_2022_extensions", "associated_token", "mint"] }

[dev-dependencies]
litesvm = { version = "0.18.2", features = ["precompiles"] }
litesvm-token = "0.18.2"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
solana-message = "4.2.4"
solana-ed25519-program = "3.0.0"
solana-sdk-ids = "3.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
